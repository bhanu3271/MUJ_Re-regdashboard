<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MUJ Re-Registration Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <!-- HEADER -->

        <header>

            <h1>
                MUJ Re-Registration Dashboard
            </h1>

            <p>
                Aug - Sep 2026
            </p>

        </header>


        <!-- KPI CARDS -->

        <section class="kpi-grid">

            <div class="card">

                <h3>
                    Total Learners
                </h3>

                <div
                    id="totalLearners"
                    class="number"
                >
                    0
                </div>

            </div>


            <div class="card">

                <h3>
                    Exam Attended
                </h3>

                <div
                    id="examAttended"
                    class="number"
                >
                    0
                </div>

            </div>


            <div class="card">

                <h3>
                    Assignment Submitted
                </h3>

                <div
                    id="assignmentSubmitted"
                    class="number"
                >
                    0
                </div>

            </div>


            <div class="card">

                <h3>
                    Re-Reg Done
                </h3>

                <div
                    id="reregDone"
                    class="number"
                >
                    0
                </div>

            </div>


            <div class="card">

                <h3>
                    Re-Reg Not Done
                </h3>

                <div
                    id="reregNotDone"
                    class="number"
                >
                    0
                </div>

            </div>


            <div class="card">

                <h3>
                    Re-Reg %
                </h3>

                <div
                    id="reregPercentage"
                    class="number"
                >
                    0%
                </div>

            </div>

        </section>


        <!-- FILTERS -->

        <section class="filters">

            <select id="programFilter">

                <option value="">
                    All Programs
                </option>

            </select>


            <select id="batchFilter">

                <option value="">
                    All Batches
                </option>

            </select>


            <select id="semesterFilter">

                <option value="">
                    All Semesters
                </option>

            </select>


            <select id="examFilter">

                <option value="">
                    All Exam Attendance
                </option>

            </select>


            <select id="assignmentFilter">

                <option value="">
                    All Assignment Status
                </option>

            </select>


            <select id="reregFilter">

                <option value="">
                    All Re-Reg Status
                </option>

            </select>

        </section>


        <!-- SEARCH -->

        <section class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Roll No or Learner Name..."
            >

        </section>


        <!-- TABLE -->

        <section class="table-section">

            <table>

                <thead>

                    <tr>

                        <th>Roll No</th>

                        <th>Name</th>

                        <th>Program</th>

                        <th>Batch</th>

                        <th>Term Sem</th>

                        <th>Exam Attendance</th>

                        <th>Assignment</th>

                        <th>Current Sem</th>

                        <th>Re-Reg</th>

                    </tr>

                </thead>


                <tbody id="learnerTable">

                </tbody>

            </table>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
